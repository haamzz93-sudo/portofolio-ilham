<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA8DA" />
      <stop offset="100%" stop-color="#6BC0F0" />
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#4DA8DA" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Rounded Cyber Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGlow)" stroke="url(#cyanNeon)" stroke-width="16" />
  
  <!-- Outer Neon Border Ring -->
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="rgba(77, 168, 218, 0.3)" stroke-width="6" />

  <!-- Bold Tech Styled Text IES -->
  <text 
    x="50%" 
    y="55%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="'Space Grotesk', 'Arial Black', sans-serif" 
    font-size="210" 
    font-weight="900" 
    letter-spacing="-6"
    fill="url(#cyanNeon)" 
    filter="url(#neonShadow)"
  >IES</text>
  
  <!-- Cyber Dot Accent -->
  <circle cx="410" cy="370" r="24" fill="#6BC0F0" filter="url(#neonShadow)" />
</svg>